<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuánto sabes del tema?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#B5651D;--cr:#FFF6E3;--dk:#3B2412;--ok:#4C8B3A;--no:#C0452F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cr);color:var(--dk);font:16px/1.55 Nunito,system-ui,sans-serif}
body{padding:10px 14px 50px;background-image:radial-gradient(rgba(181,101,29,.12) 1.5px,transparent 1.5px);background-size:22px 22px}
.w{max-width:820px;margin:0 auto}
h1,h2,.btn,.dot{font-family:Fredoka,Nunito,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn{background:#fff;border:2px solid var(--ac);color:var(--ac);border-radius:999px;padding:7px 18px;font-weight:700;transition:.15s}
.btn:hover{background:var(--ac);color:#fff;transform:translateY(-2px)}.btn.m{background:var(--ac);color:#fff}
#mute{border:0;background:none;font-size:1.3rem}
.hd{background:linear-gradient(135deg,var(--ac),#7A3F1F);color:#fff;border-radius:22px;padding:18px 22px;display:flex;gap:16px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.hd .big{font-size:3.4rem;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(5deg)}}
h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.15}.hd p{margin:4px 0 0}
.dots{display:flex;justify-content:center;gap:10px;margin:16px 0 12px}
.dot{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #e0c9a6;display:grid;place-items:center;font-weight:700;transition:.3s}
.dot.on{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.15)}.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}.dot.bad{background:var(--no);border-color:var(--no);color:#fff}
.card{background:#fff;border:3px solid var(--ac);border-radius:22px;padding:22px;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
h2{margin:0 0 8px;color:var(--ac);font-size:1.45rem}
.q{font-size:1.2rem;font-weight:700;margin:4px 0 12px}
.tag{display:inline-block;background:#F6E3C6;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;margin-bottom:6px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#FFF8EA;border:3px solid #e0c9a6;border-radius:16px;padding:11px 14px;margin:9px 0;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(5px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
.opt.ok{background:#E4F1DB;border-color:var(--ok)}.opt.bad{background:#FBE1DA;border-color:var(--no)}
.opt .mk{margin-left:auto;font-size:1.5rem;font-weight:700;animation:pop .3s}.ok .mk{color:var(--ok)}.bad .mk{color:var(--no)}
.fb{margin-top:12px;padding:11px 14px;border-radius:14px}.fb.ok{background:#E4F1DB;border:2px solid var(--ok)}.fb.bad{background:#FBE1DA;border:2px solid var(--no)}.fb:empty{display:none}
.box{background:#FFF0B8;border-radius:14px;padding:10px 14px;margin:12px 0}
.nav{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.res{text-align:center}.res .n{font-size:3.6rem;font-family:Fredoka,sans-serif;color:var(--ac);line-height:1}
ul.rep{text-align:left;margin:8px auto;max-width:520px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:9px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:92%;text-align:center}#toast.on{opacity:1}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #000;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="w">
<div class="bar"><button class="btn" id="back">← Volver al cuadernillo</button><button id="mute" aria-label="Sonido">🔊</button></div>
<div class="hd"><span class="big">🧭</span><div><h1>¿Cuánto sabes del tema?</h1><p>Actividad diagnóstica · Licenciamiento de software</p></div></div>
<div class="dots" id="dots"></div><div id="main"></div></div><div id="toast"></div>
<script>
/* ===== PREGUNTAS (borrador: valida con tu material) ===== */
const Q=[
 {t:"Verdadero o falso",q:"Tener una licencia de software significa ser dueño del software.",o:["Verdadero","Falso"],c:1,
  ex:"Tener una licencia no significa ser dueño del software: el usuario obtiene un derecho de uso de acuerdo con las condiciones establecidas por el titular.",ref:"¿Qué es una licencia de software?"},
 {t:"Selección múltiple",q:"¿Quién es el licenciatario?",o:["Quien autoriza el uso del software","Quien recibe la autorización para utilizarlo","El autor del programa"],c:1,
  ex:"El licenciante es quien autoriza el uso del software y el licenciatario es quien recibe la autorización para utilizarlo.",ref:"¿Qué es una licencia de software?"},
 {t:"Verdadero o falso",q:"Software libre es lo mismo que software gratis.",o:["Verdadero","Falso"],c:1,
  ex:"Libre se refiere a las libertades del usuario, no necesariamente al precio del programa.",ref:"Tipos de licencia"},
 {t:"Selección múltiple",q:"¿Qué permiten los derechos patrimoniales?",o:["Reconocer el vínculo del autor con su obra","Controlar la explotación económica de la obra","Instalar el programa en todos los equipos que quieras"],c:1,
  ex:"Los derechos morales reconocen el vínculo del autor con su obra; los patrimoniales permiten controlar su explotación económica.",ref:"Derechos sobre el software"},
 {t:"Selección múltiple",q:"¿Cuál de estas es una licencia open source conocida?",o:["Decreto 1360","GPL","Licenciatario"],c:1,
  ex:"MIT, Apache 2.0, GPL y AGPL son licencias open source muy conocidas.",ref:"Licencias más conocidas"}];
const LV=[["🌱","Estás empezando, ¡y está perfecto! Este OVA es para eso."],["🌱","Estás empezando, ¡y está perfecto! Este OVA es para eso."],["🙂","Ya conoces algo del tema. Te quedan cosas por descubrir."],["👍","Vas bien: tienes una buena base."],["🌟","¡Muy buena base! Aun así, hay detalles por aprender."],["🏆","¡Conoces muy bien el tema! Verás cómo se aplica en el OVA."]];
let i=-1,r=[];
let AC,mute=false;function snd(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const S={ok:[[660,0],[880,.12],[1320,.24]],bad:[[220,0],[165,.16]],clk:[[520,0]]}[k];
 S.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+t;o.type=k=="bad"?"triangle":"sine";o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.18,a+.02);g.gain.exponentialRampToValueAtTime(.0001,a+(k=="clk"?.08:.3));o.start(a);o.stop(a+.32)})}catch(e){}}
const $=x=>document.getElementById(x),P=new URLSearchParams(location.search);
$("mute").onclick=e=>{mute=!mute;e.target.textContent=mute?"🔇":"🔊"};
function toast(m){const t=$("toast");t.textContent=m;t.className="on";setTimeout(()=>t.className="",3800)}
function nv(k,msg){const u=P.get(k);u?window.open(u,"_top"):toast(msg)}
$("back").onclick=()=>{snd("clk");nv("back","Cierra esta ventana con la X para volver al cuadernillo.")};
function dots(){$("dots").innerHTML=Q.map((_,n)=>`<div class="dot ${r[n]?r[n].ok?"ok":"bad":n==i?"on":""}">${r[n]?(r[n].ok?"✓":"✕"):n+1}</div>`).join("")}
function show(){dots();const m=$("main");
 if(i<0){m.innerHTML=`<div class="card"><h2>Antes de empezar</h2><p>Responde cinco preguntas cortas para ver qué sabes del tema. <b>No tiene nota</b>: solo sirve para saber por dónde empezar.</p><div class="box">💡 Si no sabes una respuesta, elige la que creas más probable. Después te explicaremos cada una.</div><div class="nav"><button class="btn m" id="go">Empezar →</button></div></div>`;$("go").onclick=()=>{snd("clk");i=0;show()};return}
 if(i>=Q.length)return res();
 const q=Q[i];m.innerHTML=`<div class="card"><span class="tag">Pregunta ${i+1} de ${Q.length} · ${q.t}</span><p class="q">${q.q}</p>${q.o.map((o,n)=>`<button class="opt" data-n="${n}"><span class="l">${"ABC"[n]}</span><span>${o}</span></button>`).join("")}<div class="fb" id="fb"></div><div class="nav" id="nx"></div></div>`;
 m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,ok=n==q.c;r[i]={ok,ref:q.ref};
  m.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.n==q.c)o.classList.add("ok")});
  b.classList.add(ok?"ok":"bad");b.insertAdjacentHTML("beforeend",`<span class="mk">${ok?"✓":"✕"}</span>`);
  $("fb").className="fb "+(ok?"ok":"bad");$("fb").innerHTML=`<b>${ok?"¡Correcto!":"No exactamente."}</b> ${q.ex}${ok?"":` <i>Lo verás en: ${q.ref}.</i>`}`;snd(ok?"ok":"bad");dots();
  $("nx").innerHTML=`<button class="btn m" id="sg">${i==Q.length-1?"Ver mi resultado →":"Siguiente →"}</button>`;$("sg").onclick=()=>{snd("clk");i++;show()}})}
function res(){const s=r.filter(x=>x.ok).length,rep=[...new Set(r.filter(x=>!x.ok).map(x=>x.ref))],L=LV[s];
 $("main").innerHTML=`<div class="card res"><div style="font-size:3rem">${L[0]}</div><div class="n">${s}/5</div><p><b>${L[1]}</b></p>
 ${rep.length?`<div class="box"><b>Te conviene prestar atención a:</b><ul class="rep">${rep.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:`<div class="box">🎉 Acertaste todo. Aun así, el OVA te mostrará cómo se aplica en la práctica.</div>`}
 <p>Este resultado no cuenta como nota.</p><div class="nav"><button class="btn" id="rt">🔁 Repetir</button><button class="btn m" id="st">Empezar el OVA →</button></div></div>`;
 snd(s>=4?"ok":"clk");$("rt").onclick=()=>{snd("clk");r=[];i=0;show()};$("st").onclick=()=>{snd("clk");nv("next","Cierra esta ventana y pasa a la siguiente página del cuadernillo.")}}
show();
</script></body></html>
