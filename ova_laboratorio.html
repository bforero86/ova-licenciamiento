<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio · Identifica la licencia de un proyecto</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#2F6F5E;--ac2:#B5651D;--cr:#FFF6E3;--dk:#3B2412;--ok:#4C8B3A;--no:#C0452F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cr);color:var(--dk);font:16px/1.55 Nunito,system-ui,sans-serif}
body{padding:10px 14px 50px;background-image:radial-gradient(rgba(47,111,94,.1) 1.5px,transparent 1.5px);background-size:22px 22px}
.w{max-width:900px;margin:0 auto}
h1,h2,.btn,.sn{font-family:Fredoka,Nunito,sans-serif}
button,select{font:inherit;color:inherit}button{cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn{background:#fff;border:2px solid var(--ac);color:var(--ac);border-radius:999px;padding:7px 18px;font-weight:700;transition:.15s}
.btn:hover:not(:disabled){background:var(--ac);color:#fff;transform:translateY(-2px)}.btn.m{background:var(--ac);color:#fff}.btn:disabled{opacity:.4;cursor:default}
#mute{border:0;background:none;font-size:1.3rem}
.hd{background:linear-gradient(135deg,var(--ac),#1F4F43);color:#fff;border-radius:22px;padding:18px 22px;display:flex;gap:16px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.hd .big{font-size:3.4rem;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
h1{margin:0;font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.15}.hd p{margin:4px 0 0;opacity:.95}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chips span{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 12px;font-size:.88rem}
.steps{display:flex;justify-content:space-between;margin:18px 6px 14px;position:relative}
.steps:before{content:"";position:absolute;left:5%;right:5%;top:19px;border-top:4px dashed #b9cfc7}
.sn{position:relative;text-align:center;flex:1;font-size:.82rem;color:#6b7f78}
.sn i{display:grid;place-items:center;margin:0 auto 4px;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #b9cfc7;font-style:normal;font-weight:700;font-size:1.1rem;transition:.3s}
.sn.on i{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.12)}.sn.on{color:var(--ac);font-weight:700}
.sn.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:#fff;border:3px solid var(--ac);border-radius:22px;padding:20px;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
h2{margin:0 0 6px;color:var(--ac);font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.pj{background:#F2F8F5;border:3px solid #b9cfc7;border-radius:18px;padding:14px;text-align:center;transition:.15s}
.pj:hover{transform:translateY(-4px);border-color:var(--ac)}.pj.sel{background:#DDF0E8;border-color:var(--ac)}
.pj b{display:block;font-size:2.2rem}.pj a{color:var(--ac);font-weight:700;display:inline-block;margin-top:6px}
.box{border-radius:14px;padding:10px 14px;margin:10px 0}.key{background:#FFF0B8}.tip{background:#E4F1DB}
.ck{display:flex;gap:10px;align-items:flex-start;background:#F2F8F5;border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;border:2px solid transparent}
.ck:hover{border-color:var(--ac)}.ck input{width:22px;height:22px;accent-color:var(--ok);margin-top:2px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.fd label{display:block;font-weight:700;margin-bottom:4px}.fd select{width:100%;padding:9px;border:3px solid #b9cfc7;border-radius:12px;background:#fff}
.fd.ok select{border-color:var(--ok);background:#E4F1DB}.fd.bad select{border-color:var(--no);background:#FBE1DA}
.fd small{display:block;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:#F2F8F5;border:3px solid #b9cfc7;border-radius:14px;padding:10px 14px;margin:8px 0;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(4px)}.opt.ok{background:#E4F1DB;border-color:var(--ok)}.opt.bad{background:#FBE1DA;border-color:var(--no)}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px}.fb.ok{background:#E4F1DB;border:2px solid var(--ok)}.fb.bad{background:#FBE1DA;border:2px solid var(--no)}.fb:empty{display:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin:10px 0}th,td{padding:8px;border-bottom:2px solid #dcebe5;text-align:left}th{color:var(--ac);width:45%}
.lvl{text-align:center;font-size:1.3rem;margin:12px 0}.lvl b{display:block;font-size:3rem}
.st{position:fixed;top:-30px;font-size:1.5rem;animation:fall 3s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:9px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
.btn:focus-visible,.opt:focus-visible,select:focus-visible,.ck:focus-within{outline:3px solid #000;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="w">
<div class="bar"><button class="btn" id="back">← Volver al cuadernillo</button><button id="mute" aria-label="Sonido">🔊</button></div>
<div class="hd"><span class="big">🔬</span><div><h1>Laboratorio: identifica la licencia de un proyecto real</h1>
<p>Vas a investigar un proyecto público, leer su licencia y tomar una decisión como profesional.</p>
<div class="chips"><span>⏱ 15 a 20 min</span><span>💻 Solo un navegador</span><span>🧾 Entregas una ficha</span></div></div></div>
<div class="steps" id="steps"></div><div id="main"></div></div><div id="toast"></div>
<script>
/* ===== DATOS ===== (verifica en cada repositorio: si la licencia cambió, vale lo que veas allí) */
const PR=[
 {n:"React",ic:"⚛️",url:"https://github.com/facebook/react",lic:"MIT",tipo:"Permisiva",cerr:"Sí",red:"No"},
 {n:"Kubernetes",ic:"☸️",url:"https://github.com/kubernetes/kubernetes",lic:"Apache 2.0",tipo:"Permisiva",cerr:"Sí",red:"No"},
 {n:"Linux (kernel)",ic:"🐧",url:"https://github.com/torvalds/linux",lic:"GPL",tipo:"Copyleft",cerr:"No",red:"No"},
 {n:"Nextcloud",ic:"☁️",url:"https://github.com/nextcloud/server",lic:"AGPL",tipo:"Copyleft",cerr:"No",red:"Sí"}];
const F=[{k:"lic",l:"1. ¿Qué licencia tiene?",o:["MIT","Apache 2.0","GPL","AGPL","Otra"],e:"El nombre aparece en el archivo de licencia del repositorio."},
 {k:"tipo",l:"2. ¿Es permisiva o copyleft?",o:["Permisiva","Copyleft"],e:"MIT y Apache 2.0 son permisivas; GPL y AGPL son copyleft."},
 {k:"cerr",l:"3. ¿Los derivados pueden cerrarse?",o:["Sí","No"],e:"En las permisivas los derivados pueden cerrarse; en las copyleft deben mantener la licencia."},
 {k:"red",l:"4. ¿Cubre el uso como servicio en red?",o:["Sí","No"],e:"De estas cuatro, solo la AGPL cubre además los programas ofrecidos como servicio en red."}];
const LV=["📖 Repasa el cuadernillo y repite el laboratorio.","📖 Vas empezando: revisa los errores de la ficha.","🙂 Buen intento: te faltan algunos detalles.","👍 ¡Bien! Dominas casi todo.","🌟 ¡Muy bien! Casi perfecto.","🏆 ¡Laboratorio perfecto! Ya identificas licencias como profesional."];
const ST=["Elige","Busca","Registra","Decide","Ficha"];
let s=0,p=null,ck=[0,0,0],ans={},res={},dec=null;
/* ===== SONIDO ===== */
let AC,mute=false;function snd(k){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const S={ok:[[660,0],[880,.12],[1320,.24]],bad:[[220,0],[165,.16]],clk:[[520,0]]}[k];
 S.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+t;o.type=k=="bad"?"triangle":"sine";o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.18,a+.02);g.gain.exponentialRampToValueAtTime(.0001,a+(k=="clk"?.08:.3));o.start(a);o.stop(a+.32)})}catch(e){}}
$=i=>document.getElementById(i);$("mute").onclick=e=>{mute=!mute;e.target.textContent=mute?"🔇":"🔊"};
const P=new URLSearchParams(location.search);
function toast(m){const t=$("toast");t.textContent=m;t.className="on";setTimeout(()=>t.className="",3500)}
$("back").onclick=()=>{snd("clk");const u=P.get("back");u?window.open(u,"_top"):toast("Cierra esta ventana con la X para volver al cuadernillo.")};
/* ===== PASOS ===== */
function go(n){s=n;snd("clk");draw()}
function draw(){$("steps").innerHTML=ST.map((t,i)=>`<div class="sn ${i==s?"on":i<s?"done":""}"><i>${i<s?"✓":i+1}</i>${t}</div>`).join("");
 const m=$("main");m.className="";void m.offsetWidth;m.innerHTML=[v0,v1,v2,v3,v4][s]();bind()}
const nav=(a,b,dis)=>`<div class="nav">${a?`<button class="btn" data-g="${s-1}">← Atrás</button>`:"<span></span>"}${b?`<button class="btn m" data-g="${s+1}" ${dis?"disabled":""} id="nx">${b}</button>`:""}</div>`;
function v0(){return `<div class="card"><h2>Paso 1 · Elige tu proyecto</h2><p>Cada proyecto usa una licencia distinta. Elige uno y ábrelo en GitHub en otra pestaña.</p>
<div class="grid">${PR.map((x,i)=>`<div class="pj ${p===i?"sel":""}" data-p="${i}"><b>${x.ic}</b><strong>${x.n}</strong><br><a href="${x.url}" target="_blank" rel="noopener">Abrir en GitHub ↗</a><br><button class="btn" data-p="${i}" style="margin-top:8px">${p===i?"✓ Elegido":"Elegir"}</button></div>`).join("")}</div>
<div class="box key">💡 <b>Tip:</b> puedes repetir el laboratorio con otro proyecto al final.</div>${nav(0,"Siguiente →",p===null)}</div>`}
function v1(){const L=["Abrí el repositorio en GitHub","Encontré el archivo de licencia (normalmente LICENSE o COPYING)","Leí el nombre de la licencia y sus condiciones principales"];
 return `<div class="card"><h2>Paso 2 · Busca la licencia de ${PR[p].ic} ${PR[p].n}</h2>${L.map((t,i)=>`<label class="ck"><input type="checkbox" data-c="${i}" ${ck[i]?"checked":""}> <span>${t}</span></label>`).join("")}
<div class="box tip">🔎 <b>Dónde mirar:</b> en la lista de archivos de la página principal del repositorio y, si GitHub la detectó, en el panel de información lateral. <i>Verifica cómo lo muestra GitHub hoy: la pantalla puede cambiar.</i></div>
<div class="box key">💡 Lo importante no es memorizar: es <b>leer qué permite, qué exige y qué limita</b>.</div>${nav(1,"Siguiente →",ck.some(x=>!x))}</div>`}
function v2(){const x=PR[p];return `<div class="card"><h2>Paso 3 · Registra lo que encontraste</h2><p>Completa los datos de <b>${x.n}</b> y pulsa <b>Comprobar</b>.</p>
<div class="form">${F.map(f=>`<div class="fd ${res[f.k]||""}" id="f_${f.k}"><label>${f.l}</label><select data-f="${f.k}"><option value="">Elige…</option>${f.o.map(o=>`<option ${ans[f.k]==o?"selected":""}>${o}</option>`).join("")}</select><small id="e_${f.k}"></small></div>`).join("")}</div>
<button class="btn m" id="chk">Comprobar</button><div class="fb" id="fb2"></div>${nav(1,"Siguiente →",!Object.keys(res).length)}</div>`}
function v3(){const x=PR[p],cp=x.tipo=="Permisiva",O=cp?[["Nada: al ser open source puedo hacer lo que quiera, sin condiciones.",0,"Open source no significa sin condiciones: toda licencia tiene reglas."],["Leer y respetar las condiciones de su licencia (por ejemplo, conservar su aviso).",1,"Correcto: aunque sea permisiva, sus condiciones se respetan."],["Pedir permiso al autor, porque ninguna licencia permite uso comercial.",0,"No es cierto: lo que se puede hacer lo define cada licencia, y se verifica leyéndola."]]
 :[["Nada: al ser open source puedo hacer lo que quiera, sin condiciones.",0,"Open source no significa sin condiciones: toda licencia tiene reglas."],["Revisar si mis cambios o derivados deben mantener la misma licencia y cumplir lo que exige.",1,"Correcto: en las licencias copyleft los derivados mantienen la licencia."],["Cerrar el código siempre, porque soy una empresa.",0,"En las copyleft no siempre se puede cerrar el código: depende de lo que exija la licencia."]];
 return `<div class="card"><h2>Paso 4 · Decide como profesional</h2><div class="box key">🏢 Tu empresa quiere usar <b>${x.ic} ${x.n}</b> dentro de un producto que va a vender. ¿Qué haces primero?</div>
${O.map((o,i)=>`<button class="opt ${dec&&dec.i==i?(o[1]?"ok":"bad"):""}" data-d="${i}" data-ok="${o[1]}" data-t="${o[2]}" ${dec&&dec.ok?"disabled":""}>${o[0]}</button>`).join("")}
<div class="fb ${dec?(dec.ok?"ok":"bad"):""}" id="fb4">${dec?`<b>${dec.ok?"¡Correcto!":"No exactamente."}</b> ${dec.t}`:""}</div>${nav(1,"Ver mi ficha →",!(dec&&dec.ok))}</div>`}
function v4(){const x=PR[p];let pts=F.filter(f=>res[f.k]=="ok").length+(dec&&dec.ok?1:0);
 return `<div class="card"><h2>Paso 5 · Tu ficha de laboratorio</h2><table><tr><th>Proyecto</th><td>${x.n}</td></tr>${F.map(f=>`<tr><th>${f.l.slice(3)}</th><td>${ans[f.k]||"—"} ${res[f.k]=="ok"?"✅":"❌"}</td></tr>`).join("")}<tr><th>Decisión profesional</th><td>${dec&&dec.ok?"Respetar las condiciones de la licencia ✅":"—"}</td></tr></table>
<div class="lvl"><b>${pts}/5</b>${LV[pts]}</div><div class="nav"><button class="btn" id="cp">📋 Copiar ficha</button><button class="btn m" id="rs">🔁 Probar otro proyecto</button></div></div>`}
function bind(){const m=$("main");
 m.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go(+b.dataset.g));
 m.querySelectorAll("[data-p]").forEach(b=>b.onclick=e=>{if(e.target.tagName=="A")return;p=+b.dataset.p;ans={};res={};dec=null;ck=[0,0,0];snd("clk");draw()});
 m.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{ck[+c.dataset.c]=c.checked?1:0;snd("clk");$("nx").disabled=ck.some(x=>!x)});
 m.querySelectorAll("[data-f]").forEach(c=>c.onchange=()=>{ans[c.dataset.f]=c.value;delete res[c.dataset.f]});
 if($("chk"))$("chk").onclick=()=>{const x=PR[p];if(F.some(f=>!ans[f.k])){toast("Completa los cuatro datos primero.");return}let n=0;
  F.forEach(f=>{const ok=ans[f.k]==x[f.k];res[f.k]=ok?"ok":"bad";n+=ok;$("f_"+f.k).className="fd "+res[f.k];$("e_"+f.k).textContent=ok?"✓ "+f.e:"✕ Revisa: "+f.e})
  $("fb2").className="fb "+(n==4?"ok":"bad");$("fb2").innerHTML=n==4?"<b>¡Correcto!</b> Identificaste bien la licencia y sus características.":`<b>Acertaste ${n} de 4.</b> Mira las pistas, corrige y vuelve a comprobar. Si lo que ves en el repositorio es distinto, anótalo y consúltalo con tu grupo.`;
  snd(n==4?"ok":"bad");$("nx").disabled=false};
 m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const ok=b.dataset.ok=="1";dec={i:+b.dataset.d,ok,t:b.dataset.t};snd(ok?"ok":"bad");
  m.querySelectorAll("[data-d]").forEach(o=>{if(o==b)o.classList.add(ok?"ok":"bad");if(ok)o.disabled=true});$("fb4").className="fb "+(ok?"ok":"bad");$("fb4").innerHTML=`<b>${ok?"¡Correcto!":"No exactamente."}</b> ${dec.t}`;if(ok)$("nx").disabled=false});
 if($("cp"))$("cp").onclick=()=>{const x=PR[p];const t=`LABORATORIO · Identifica la licencia de un proyecto\nProyecto: ${x.n}\n`+F.map(f=>`${f.l.slice(3)} ${ans[f.k]||"—"}`).join("\n");navigator.clipboard.writeText(t).then(()=>toast("Ficha copiada"),()=>toast("No se pudo copiar"))};
 if($("rs"))$("rs").onclick=()=>{p=null;ans={};res={};dec=null;ck=[0,0,0];go(0)};
 if(s==4&&!window._c){window._c=1;snd("ok");if(F.every(f=>res[f.k]=="ok")&&dec&&dec.ok)for(let i=0;i<20;i++){const e=document.createElement("span");e.className="st";e.textContent=["⭐","✨","🎉"][i%3];e.style.left=Math.random()*95+"%";e.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
 if(s!=4)window._c=0}
draw();
</script></body></html>
